  /* First-time visitors: a space-coloured cover is painted with the very first frame, so the page is
     never seen before the welcome tour opens (the tour takes over from it). */
  html.tour-pending::before{content:''; position:fixed; inset:0; z-index:9999; pointer-events:none;
    background:radial-gradient(1300px 760px at 50% 38%, #141c40 0%, #0a0e20 52%, #04050c 100%);}
  /* a small pulsing star, so a slow connection shows "loading" rather than an empty dark screen */
  html.tour-pending::after{content:''; position:fixed; left:50%; top:46%; width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; z-index:9999; pointer-events:none; background:#8fb4ff; box-shadow:0 0 22px 6px rgba(143,180,255,.55);
    animation:tourPending 1.1s ease-in-out infinite;}
  @keyframes tourPending{0%,100%{opacity:.25; transform:scale(.7);}50%{opacity:1; transform:scale(1.25);}}
</style>
<script>
(function () {
  try {
    var forced = /[?&]tour(=1|=true)?(&|$)/.test(location.search);
    var seen = localStorage.getItem('ds4-tour-seen') === '1';
    var bot = /bot|crawl|spider|slurp|lighthouse|pagespeed/i.test(navigator.userAgent);
    if ((forced || !seen) && !bot) {
      var root = document.documentElement;
      root.classList.add('tour-pending');
      setTimeout(function () { root.classList.remove('tour-pending'); }, 4500);
    }
  } catch (e) {}
})();
</script>

<style>
  :root{
    --bg:#0b0e14;
    --panel:#12161f;
    --panel-2:#181d29;
    --line:#232a3a;
    --text:#e8ecf5;
    --dim:#7a8399;
    --accent:#3b82f6;
    --accent-glow: rgba(59,130,246,.35);
    --danger:#ef4444;
    --ok:#22c55e;
    --warn:#f59e0b;
    --nav-glow-x: 50%;
    --nav-glow-color: rgba(59,130,246,.28);
  }
  html{scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Cairo', 'Segoe UI', sans-serif;
    min-height:100vh;
    padding:28px 18px 60px;
    position:relative;
  }
  .wrap{position:relative; z-index:1;}

  #starfield, #cloudLayer{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  .wrap{max-width:760px; margin:0 auto;}

  header{margin-bottom:24px;}
  h1{font-size:26px; font-weight:800; margin:0 0 6px;}
  .sub{color:var(--dim); font-size:14.5px; line-height:1.7; margin:0;}
  .seo-intro{color:var(--dim); font-size:12.5px; line-height:1.7; margin:10px 0 0; opacity:.75;}

  .bar-strip{
    height:6px; border-radius:6px; margin:20px 0 26px;
    background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7);
    box-shadow:0 0 18px rgba(255,255,255,.08);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    transition:border-color .4s ease, box-shadow .4s ease, transform .25s ease;
  }
  .panel:hover{transform:translateY(-2px); box-shadow:0 10px 28px -12px rgba(0,0,0,.5);}

  .status-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--dim); flex-shrink:0; transition:.3s;}
  .dot.on{background:var(--ok); box-shadow:0 0 10px var(--ok);}
  .dot.err{background:var(--danger); box-shadow:0 0 10px var(--danger);}
  .status-text{font-size:14px; color:var(--dim); flex:1; min-width:200px; text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .status-text b{color:var(--text); font-weight:600;}

  button{
    font-family:'Cairo', sans-serif;
    font-weight:600;
    border:none;
    border-radius:10px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(.94);}
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    transform:scale(0);
    animation:rippleExpand .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleExpand{
    to{transform:scale(2.6); opacity:0;}
  }
  button:disabled{opacity:.4; cursor:not-allowed;}

  .connect-btn{
    background:var(--accent);
    color:#fff;
    padding:11px 22px;
    font-size:14.5px;
    box-shadow:0 4px 16px var(--accent-glow);
    animation:connectPulse 2.4s ease-in-out infinite;
  }
  .connect-btn:disabled{animation:none;}
  @keyframes connectPulse{0%,100%{box-shadow:0 4px 16px var(--accent-glow);}50%{box-shadow:0 4px 26px 4px var(--accent-glow);}}
  body:not(.gamepad-nav-active) .connect-btn:hover:not(:disabled){box-shadow:0 6px 20px var(--accent-glow);}

  .mode-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--dim);
    direction:ltr;
  }
  .mode-tag.usb{color:var(--ok); border-color:rgba(34,197,94,.4);}
  .mode-tag.bt{color:var(--accent); border-color:rgba(59,130,246,.4);}

  .section-title{
    font-size:13px; color:var(--dim); font-weight:600;
    margin:0 0 14px; display:flex; align-items:center; gap:8px;
  }
  .section-title::after{content:""; flex:1; height:1px; background:var(--line);}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.grid{grid-template-columns:1fr;}}

  .event-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:16px 14px;
    text-align:right;
    display:flex; flex-direction:column; gap:4px;
    font-size:15px;
  }
  body:not(.gamepad-nav-active) .event-btn:hover:not(:disabled){
    border-color:var(--swatch, var(--accent));
    box-shadow:0 0 16px -2px var(--swatch, var(--accent-glow));
  }
  .event-btn .swatch{
    width:22px; height:22px; border-radius:6px;
    background:var(--swatch);
    box-shadow:0 0 10px var(--swatch);
    margin-bottom:4px;
  }
  .event-btn .label{font-weight:600;}

  @keyframes swatchPolice{
    0%,100%{background:#ef4444; box-shadow:0 0 10px #ef4444;}
    50%{background:#0a5aff; box-shadow:0 0 10px #0a5aff;}
  }
  .swatch-police{animation:swatchPolice 1.1s ease-in-out infinite;}

  @keyframes swatchLowhealth{
    0%,100%{background:rgb(200,0,0); box-shadow:0 0 10px rgba(200,0,0,.8);}
    50%{background:rgb(40,0,0); box-shadow:0 0 6px rgba(40,0,0,.5);}
  }
  .swatch-lowhealth{animation:swatchLowhealth 1s ease-in-out infinite;}

  @keyframes swatchLowammo{
    0%,100%{background:rgb(200,120,0); box-shadow:0 0 10px rgba(200,120,0,.8);}
    50%{background:rgb(60,30,0); box-shadow:0 0 6px rgba(60,30,0,.5);}
  }
  .swatch-lowammo{animation:swatchLowammo 1.4s ease-in-out infinite;}

  @keyframes swatchWin{
    0%,100%{background:#ffd700; box-shadow:0 0 10px #ffd700;}
    33%{background:#00ff78; box-shadow:0 0 10px #00ff78;}
    66%{background:#0096ff; box-shadow:0 0 10px #0096ff;}
  }
  .swatch-win{animation:swatchWin 1.4s ease-in-out infinite;}

  @keyframes swatchAbility{
    0%,100%{background:#ffffff; box-shadow:0 0 10px #ffffff;}
    50%{background:#0a6cff; box-shadow:0 0 10px #0a6cff;}
  }
  .swatch-ability{animation:swatchAbility .9s ease-in-out infinite;}

  @keyframes swatchTorch{
    0%,100%{background:rgb(255,140,0); box-shadow:0 0 10px rgba(255,140,0,.8);}
    25%{background:rgb(255,170,40); box-shadow:0 0 10px rgba(255,170,40,.8);}
    50%{background:rgb(255,110,0); box-shadow:0 0 10px rgba(255,110,0,.8);}
    75%{background:rgb(255,190,60); box-shadow:0 0 10px rgba(255,190,60,.8);}
  }
  .swatch-torch{animation:swatchTorch 1.2s ease-in-out infinite;}
  .event-btn .desc{font-size:12px; color:var(--dim); font-weight:400;}

  .floating-stop-btn{
    position:fixed;
    bottom:14px;
    inset-inline-end:14px;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 16px;
    border-radius:999px;
    background:rgba(24,29,41,.72);
    backdrop-filter:blur(24px) saturate(1.3);
    -webkit-backdrop-filter:blur(24px) saturate(1.3);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Cairo', sans-serif;
    font-size:13px;
    font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.4), 0 0 10px 1px rgba(239,68,68,.35);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease, border-color .3s ease;
  }
  body:not(.gamepad-nav-active) .floating-stop-btn:hover:not(:disabled){
    border-color:var(--danger);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 16px 3px rgba(239,68,68,.5);
  }
  .floating-stop-btn:active:not(:disabled){
    transform:translateY(0) scale(.97);
    box-shadow:0 6px 20px rgba(0,0,0,.4), 0 0 22px 6px rgba(239,68,68,.75);
  }
  .floating-stop-btn:disabled{opacity:.35; cursor:not-allowed;}
  .floating-stop-btn.is-hidden{opacity:0 !important; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility 0s linear .25s;}
  .floating-stop-btn .stop-circle-icon{
    font-size:16px;
    font-weight:700;
    color:var(--danger);
    line-height:1;
    flex-shrink:0;
  }

  .note{
    font-size:12.5px; color:var(--dim); line-height:1.8;
    background:var(--panel-2);
    border-radius:10px; padding:14px 16px;
    border:1px solid var(--line);
  }
  .note code{
    font-family:'JetBrains Mono', monospace;
    background:rgba(255,255,255,.06);
    padding:1px 6px; border-radius:5px;
    direction:ltr; display:inline-block;
    font-size:11.5px;
  }

  .unsupported{
    display:none;
    background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
    padding:14px 16px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:18px;
    line-height:1.7;
  }

  /* ==================== Top Bar & Pill Switcher (Compact Translucent + Spring/Morph Indicator) ==================== */
  .top-bar{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; flex-wrap:wrap;
    padding:8px 14px;
    background:rgba(18,22,31,.52);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border-bottom:1px solid rgba(255,255,255,.08);
    border-radius:0 0 16px 16px;
    position:sticky; top:0; z-index:100;
  }
  .mode-switch{
    display:flex; gap:3px;
    background:rgba(20,25,36,.58);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.11);
    border-radius:999px;
    padding:3px;
    position:relative;
  }
  .tab-indicator-layer{
    position:absolute; inset:3px;
    z-index:0;
    pointer-events:none;
  }
  .tab-indicator{
    position:absolute; top:0; left:0;
    height:100%;
    border-radius:999px;
    background:linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 2px 10px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.32);
    transition:
      left .42s cubic-bezier(.34,1.38,.64,1),
      width .42s cubic-bezier(.34,1.38,.64,1),
      transform .22s cubic-bezier(.34,1.56,.64,1),
      box-shadow .25s ease;
  }
  .tab-indicator.is-morphing{
    transform:scaleX(1.06) scaleY(.92);
    box-shadow:0 4px 16px rgba(59,130,246,.32), inset 0 1px 0 rgba(255,255,255,.42);
  }

  .mode-btn{
    display:flex; align-items:center; gap:5px;
    padding:6px 13px;
    border-radius:999px;
    font-size:12px; font-weight:600;
    position:relative; z-index:1;
    border:none;
    background:transparent;
    color:var(--dim);
    font-family:'Cairo', sans-serif;
    cursor:pointer;
    transition:color .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .mode-btn .mode-icon{
    display:inline-flex;
    transition:transform .32s cubic-bezier(.34,1.56,.64,1), filter .25s ease;
  }
  .mode-btn.active{
    color:#fff;
  }
  .mode-btn.active .mode-icon{
    transform:scale(1.12);
    filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
  }
  .mode-btn:active{
    transform:scale(.95);
  }

  .grad-text{
    background-image:linear-gradient(90deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
  }
  .mode-btn.active .grad-text{
    background:none; color:#fff; -webkit-text-fill-color:#fff;
  }

  .text-3d{
    color:#f4f6fb;
    text-shadow:
      1px 1px 0 rgba(255,255,255,.35),
      1px 2px 0 #0d1420,
      2px 3px 0 #0d1420,
      3px 4px 0 #0d1420,
      4px 5px 6px rgba(0,0,0,.55);
  }
  .mode-btn:not(.active):hover{color:var(--text);}

  /* ==================== Quicknav + Steam-style Light Strip ==================== */
  .quicknav{
    position:relative;
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:14px;
    padding:7px 8px 11px;
    border-radius:14px;
    background:rgba(18,22,31,.52);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);
    align-items:center;
    overflow:hidden;
  }
  /* Steam-style light strip along the bottom edge */
  .quicknav::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:2.5px;
    pointer-events:none;
    background:
      radial-gradient(120px 14px at var(--nav-glow-x, 50%) 100%, var(--nav-glow-color, rgba(59,130,246,.55)), transparent 75%),
      linear-gradient(90deg, rgba(239,68,68,.22), rgba(245,158,11,.22), rgba(34,197,94,.22), rgba(59,130,246,.32), rgba(168,85,247,.22));
    box-shadow:0 -2px 10px var(--nav-glow-color, rgba(59,130,246,.35));
    transition:background .25s ease, box-shadow .25s ease;
  }
  .quicknav a{
    position:relative;
    font-size:11.5px; font-weight:600;
    color:var(--dim);
    background:rgba(24,29,41,.68);
    border:1px solid rgba(255,255,255,.08);
    padding:5px 11px;
    border-radius:999px;
    text-decoration:none;
    transition:color .18s ease, border-color .2s ease, background .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
  }
  .quicknav a:hover{
    color:#fff;
    border-color:rgba(147,197,253,.45);
    background:rgba(59,130,246,.16);
    transform:translateY(-1px);
    box-shadow:0 4px 12px -2px rgba(59,130,246,.35);
  }
  .quicknav a.is-lit{
    color:#fff;
    border-color:rgba(255,255,255,.32);
    background:rgba(255,255,255,.1);
    box-shadow:0 2px 12px var(--nav-glow-color, rgba(59,130,246,.35));
  }

  #starWipe{position:fixed; inset:0; width:100%; height:100%; z-index:20000; display:none;}
  .no-tab-anim .tab-indicator{transition:none !important;}

  .lang-toggle{
    display:flex;
    background:rgba(20,25,36,.58);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.11);
    border-radius:999px;
    padding:3px;
    gap:2px;
    position:relative;
  }
  .lang-toggle button{
    position:relative; z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:600;
    padding:5px 10px;
    border-radius:999px;
    background:transparent;
    color:var(--dim);
    transition:color .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .lang-toggle button.active{
    color:#fff;
  }
  .lang-toggle button:active{
    transform:scale(.94);
  }

  h2.panel-title{
    font-size:19px; font-weight:800; margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
    scroll-margin-top:20px;
  }
  .panel-sub{color:var(--dim); font-size:13px; margin:0 0 16px; line-height:1.6;}

  .panel-header-row{
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .panel-header-row h2.panel-title{margin-bottom:0;}
  .title-with-icon{display:flex; align-items:center; gap:11px; min-width:0;}
  input[type="range"]{direction:ltr;}

  .game-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; flex-shrink:0;

  .game-icon svg{width:20px; height:20px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}

  .mute-led-btn.active{

    box-shadow:0 0 0 1px var(--swatch) inset;
